<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPV - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos exclusivos para centrar el login */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
        }
        .login-card {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="login-card">
    <img src="imagenes/LogoASPV.jpg" alt="Logo ASPV" style="width: 130px; border-radius: 12px; margin-bottom: 20px;">
    <h2 style="margin-top: 0; color: var(--text-color);">Bienvenido a ASPV</h2>
    <p style="color: var(--text-muted); font-size: 0.9em; margin-bottom: 30px;">Ingresa tus credenciales para continuar.</p>

    <form id="formLogin">
        <div style="text-align: left;">
            <label style="font-size: 0.85em; font-weight: bold; color: var(--text-muted);">Correo Electrónico</label>
            <input type="email" id="loginCorreo" placeholder="ejemplo@aspv.com" required>
        </div>

        <div style="text-align: left;">
            <label style="font-size: 0.85em; font-weight: bold; color: var(--text-muted);">Contraseña</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" style="width: 100%; background-color: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; transition: 0.3s;">
            Iniciar Sesión
        </button>
    </form>
</div>

<script src="login.js"></script>
</body>
</html>
